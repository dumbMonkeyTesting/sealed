<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>sealed banner</title>
  <style>
    html, body {
      margin: 0;
      width: 1500px;
      height: 500px;
      overflow: hidden;
      background: #14110e;
      color: #f6f0e6;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
    }
    .field {
      position: relative;
      width: 1500px;
      height: 500px;
      background:
        radial-gradient(720px 380px at 88% -20%, rgba(201, 138, 212, 0.22), transparent 62%),
        radial-gradient(640px 360px at -8% 30%, rgba(228, 177, 90, 0.14), transparent 58%),
        #14110e;
    }
    .glyphs {
      position: absolute;
      inset: 0;
      font-family: "IBM Plex Mono", "SFMono-Regular", ui-monospace, Consolas, monospace;
      font-size: 15px;
      pointer-events: none;
    }
    .glyphs span { position: absolute; color: rgba(228, 177, 90, 0.28); }
    .glyphs span.plum { color: rgba(201, 138, 212, 0.34); }
    .lockup {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      gap: 36px;
    }
    .mark {
      width: 168px;
      height: 168px;
      flex: none;
      filter: drop-shadow(0 0 18px rgba(228, 177, 90, 0.28));
    }
    .name {
      font-size: 92px;
      line-height: 0.9;
      font-weight: 650;
      letter-spacing: -0.045em;
    }
    .line {
      margin-top: 14px;
      color: #a89884;
      font-size: 28px;
      line-height: 1.25;
      letter-spacing: -0.02em;
    }
    .line em { font-style: normal; color: #c98ad4; }
  </style>
</head>
<body>
  <div class="field">
    <div class="glyphs">
      <span style="left:7%;top:16%">a</span>
      <span class="plum" style="left:12%;top:38%">4</span>
      <span style="left:5%;top:68%">e</span>
      <span style="left:18%;top:78%">9</span>
      <span class="plum" style="left:22%;top:18%">c</span>
      <span style="left:78%;top:14%">2</span>
      <span class="plum" style="left:86%;top:32%">b</span>
      <span style="left:91%;top:58%">7</span>
      <span class="plum" style="left:82%;top:74%">f</span>
      <span style="left:93%;top:82%">0</span>
      <span style="left:30%;top:12%">d</span>
      <span class="plum" style="left:70%;top:84%">8</span>
    </div>
    <div class="lockup">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <defs>
          <linearGradient id="sealGrad" x1="1" y1="0" x2="31" y2="32" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#f0cb86"/>
            <stop offset="0.46" stop-color="#e4b15a"/>
            <stop offset="1" stop-color="#c98ad4"/>
          </linearGradient>
        </defs>
        <rect width="32" height="32" rx="8" fill="url(#sealGrad)"/>
        <g fill="none" stroke="#1c1611" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9.3 16.5V5.1c0-.9.7-1.6 1.6-1.6h10.2c.9 0 1.6.7 1.6 1.6v11.4"/>
          <path d="M4.8 13.9 16 20.2l10.4-6.3V25.1c0 .9-.7 1.6-1.6 1.6H6.4c-.9 0-1.6-.7-1.6-1.6z"/>
          <path stroke-width="1.7" d="M18.7 7.55c0-1.4-1.2-2.15-2.7-2.15-1.85 0-2.85 1-2.85 2.45 0 1.85 5.7.85 5.7 3 0 1.45-1.3 2.5-2.95 2.5-1.75 0-2.75-1-2.8-2.3"/>
          <path stroke-width="1.7" d="M16 4.7v9.35"/>
        </g>
      </svg>
      <div>
        <div class="name">sealed</div>
        <div class="line">a transfer lands. <em>the amount is private.</em></div>
      </div>
    </div>
  </div>
</body>
</html>
